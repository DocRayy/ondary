<section class="space-y-7 pr-8 text-black">
  <div class="flex flex-wrap items-center gap-4">
    <div class="flex items-center gap-3">
      <h1 class="text-base font-extrabold text-white">Team Member List</h1>
      <span class="text-sm font-semibold text-white">( {{ totalUsers() }} )</span>
      <button
        *ngIf="canManageMembers"
        type="button"
        routerLink="/members/add"
        class="grid h-7 w-7 place-items-center rounded-full bg-tertiary-100 text-lg font-bold transition hover:bg-tertiary-200"
        aria-label="Add team member"
      >
        <fc-icon icon="add-linear" class="text-sm text-black"></fc-icon>
      </button>
    </div>

    <input
      type="text"
      placeholder="Search user"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
      class="ml-auto h-12 w-60 rounded-xl border-0 bg-tertiary-100 px-5 text-sm font-bold text-black outline-none placeholder:text-black"
    />
  </div>

  <div
    *ngIf="isLoading()"
    class="rounded-xl bg-tertiary-100 px-5 py-4 text-sm font-bold text-tertiary-700"
  >
    Loading team members...
  </div>

  <div
    *ngIf="!isLoading() && !errorMessage()"
    class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4"
  >
    <article
      *ngFor="let user of filteredUsers()"
      class="overflow-hidden rounded-xl border border-tertiary-200 bg-tertiary-50"
    >
      <div class="grid h-[300px] place-items-center overflow-hidden bg-tertiary-200">
        <img
          *ngIf="getUserPhoto(user) as userPhoto; else userPhotoPlaceholder"
          [src]="userPhoto"
          [alt]="getUserName(user)"
          class="h-full w-full object-cover"
        />
        <ng-template #userPhotoPlaceholder>
          <svg
            class="h-20 w-20 text-[#2E2E34]"
            viewBox="0 0 96 96"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
          >
            <circle cx="48" cy="27" r="14"></circle>
            <path d="M21 74c4-16 50-16 54 0"></path>
            <path d="M22 74c0 12 52 12 52 0"></path>
          </svg>
        </ng-template>
      </div>

      <div class="px-4 py-3">
        <h2 class="truncate text-sm font-extrabold">{{ getUserName(user) }}</h2>
        <div class="mt-1 flex items-center gap-2 text-xs font-medium">
          <span>{{ getUserStatus(user) }}</span>
          <span class="h-2 w-2 rounded-full bg-tertiary-200"></span>
          <span class="truncate">{{ user.role || 'member' }}</span>
        </div>
        <div *ngIf="canManageMembers" class="mt-3 flex gap-2">
          <button
            type="button"
            class="rounded-lg bg-tertiary-200 px-3 py-1.5 text-xs font-bold text-black"
            (click)="openEditUser(user)"
          >
            Edit
          </button>
          <button
            type="button"
            [disabled]="deletingId() === user.id"
            class="rounded-lg bg-red-50 px-3 py-1.5 text-xs font-bold text-red-700 disabled:cursor-not-allowed disabled:opacity-60"
            (click)="deleteUser(user)"
          >
            {{ deletingId() === user.id ? 'Deleting...' : 'Delete' }}
          </button>
        </div>
      </div>
    </article>

    <div
      *ngIf="!filteredUsers().length"
      class="rounded-xl bg-tertiary-100 px-5 py-4 text-sm font-bold text-tertiary-700"
    >
      No team members found.
    </div>
  </div>

  <div
    *ngIf="editingUser()"
    appGsapModal
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-4"
    role="presentation"
    (click)="closeEditUser()"
  >
    <form
      class="w-[min(760px,calc(100vw-32px))] rounded-xl bg-white p-6 text-black shadow-2xl"
      role="dialog"
      aria-modal="true"
      (click)="$event.stopPropagation()"
      (ngSubmit)="submitEditUser()"
    >
      <header class="flex items-center gap-3">
        <button
          type="button"
          class="grid h-8 w-8 place-items-center rounded-full bg-[#D9D9D9] text-black"
          aria-label="Close"
          (click)="closeEditUser()"
        >
          <fc-icon icon="arrow-left-linear" class="text-lg"></fc-icon>
        </button>
        <h2 class="text-base font-extrabold">Member Edit</h2>
      </header>

      <div class="mt-6 grid gap-6 md:grid-cols-[96px_minmax(0,1fr)]">
        <div class="space-y-2">
          <div class="grid h-24 w-24 place-items-center overflow-hidden rounded-md bg-[#D9D9D9] text-[#2E2E34]">
            <img
              *ngIf="editForm.photoPreview; else editPhotoPlaceholder"
              [src]="editForm.photoPreview"
              alt="Member photo preview"
              class="h-full w-full object-cover"
            />
            <ng-template #editPhotoPlaceholder>
              <fc-icon icon="user-linear" class="text-5xl"></fc-icon>
            </ng-template>
          </div>
          <label class="grid h-8 w-24 cursor-pointer place-items-center rounded-md bg-[#D9D9D9] text-2xs font-bold text-black">
            Upload Photo
            <input
              type="file"
              class="sr-only"
              [attr.accept]="imageAccept"
              (change)="onEditPhotoChange($event)"
            />
          </label>
        </div>

        <div class="grid gap-2">
          <input
            name="editUsername"
            [(ngModel)]="editForm.username"
            type="text"
            required
            placeholder="Username"
            class="h-14 rounded-md border-0 bg-[#D9D9D9] px-5 text-xs font-medium text-black outline-none placeholder:text-black"
          />
          <input
            name="editName"
            [(ngModel)]="editForm.name"
            type="text"
            required
            placeholder="Name"
            class="h-14 rounded-md border-0 bg-[#D9D9D9] px-5 text-xs font-medium text-black outline-none placeholder:text-black"
          />
          <input
            name="editEmail"
            [(ngModel)]="editForm.email"
            type="email"
            required
            placeholder="Email"
            class="h-14 rounded-md border-0 bg-[#D9D9D9] px-5 text-xs font-medium text-black outline-none placeholder:text-black"
          />
          <input
            name="editPassword"
            [(ngModel)]="editForm.password"
            type="password"
            placeholder="Password"
            class="h-14 rounded-md border-0 bg-[#D9D9D9] px-5 text-xs font-medium text-black outline-none placeholder:text-black"
          />
          <select
            name="editRole"
            [(ngModel)]="editForm.role"
            required
            class="h-14 rounded-md border-0 bg-[#D9D9D9] px-5 text-xs font-medium text-black outline-none"
          >
            <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
          </select>
          <button
            type="submit"
            [disabled]="!!updatingId()"
            class="mt-3 h-14 rounded-md bg-[#D9D9D9] text-xs font-bold text-black disabled:cursor-not-allowed disabled:opacity-70"
          >
            {{ updatingId() ? 'Submitting...' : 'Submit' }}
          </button>
        </div>
      </div>
    </form>
  </div>

  <app-confirmation-modal
    [visible]="!!userPendingDelete()"
    [loading]="!!deletingId()"
    title="Delete Team Member"
    message="Are you sure you want to delete this team member?"
    (cancel)="closeDeleteDialog()"
    (confirm)="confirmDeleteUser()"
  ></app-confirmation-modal>

  <app-image-cropper
    [visible]="!!editCropFile"
    [file]="editCropFile"
    title="Crop Member Photo"
    (cancel)="cancelEditPhotoCrop()"
    (cropped)="applyEditPhotoCrop($event)"
  ></app-image-cropper>
</section>
