<div
  class="flex min-h-screen items-center justify-center bg-primary-600 px-4 py-4 sm:px-8 sm:py-0 lg:h-screen"
>
  <div
    class="relative flex h-full max-h-none w-full max-w-10xl flex-col overflow-hidden rounded-3xl bg-transparent sm:max-h-[800px] sm:flex-row"
  >
    <!-- Left: Image & Logo -->
    <div
      class="rightSection relative flex min-h-[220px] w-full flex-col items-center justify-between rounded-3xl bg-primary-200 p-6 sm:min-h-0 sm:w-1/2 sm:p-8"
    >
      <div class="w-full flex justify-start">
        <img src="images/ondary-logo-white.png" class="w-40 h-auto z-10" alt="Ondary Logo" />
      </div>
      <div
        class="absolute bottom-0 flex w-full items-start justify-start -ml-[140px] sm:-ml-[280px]"
      >
        <img
          src="images/loginchar.png"
          class="h-auto w-[420px] sm:w-[700px]"
          alt="Login Character"
        />
      </div>
      <div class="h-8"></div>
    </div>

    <div
      class="flex w-full flex-col items-center justify-center px-4 py-10 sm:w-1/2 sm:px-10 sm:py-12"
    >
      <form class="w-full max-w-sm flex flex-col gap-4" (ngSubmit)="submitLogin()">
        <h2 class="text-white text-3xl font-bold text-center mb-8">Sign In</h2>
        <div class="flex flex-col">
          <fc-input-text
            id="username"
            name="username"
            label="Username"
            [(ngModel)]="loginForm.username"
          ></fc-input-text>
          <fc-input-text
            id="password"
            name="password"
            label="Password"
            type="password"
            [(ngModel)]="loginForm.password"
          ></fc-input-text>
        </div>
        <p
          *ngIf="errorMessage"
          class="rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
        >
          {{ errorMessage }}
        </p>
        <button
          type="submit"
          class="w-full bg-primary-100 text-white font-semibold py-3 rounded-lg mt-6 shadow-sm transition hover:bg-[#e5e3e0] hover:text-primary-300 disabled:cursor-not-allowed disabled:opacity-70"
          [disabled]="loading"
        >
          {{ loading ? 'Loading...' : 'Continue' }}
        </button>
        <!-- <div class="text-center mt-1">
          <a href="#" class="text-tertiary-200 text-sm hover:underline">Forgot Password?</a>
        </div> -->
      </form>
    </div>
  </div>
</div>
