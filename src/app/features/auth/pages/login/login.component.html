<div class="h-screen flex items-center justify-center bg-primary-600 px-8">
  <div
    class="w-full max-w-10xl h-full max-h-[800px] flex rounded-3xl overflow-hidden bg-transparent flex-col sm:flex-row relative"
  >
    <!-- Left: Image & Logo -->
    <div
      class="rightSection bg-primary-200 relative flex flex-col items-center rounded-3xl justify-between p-8 w-full sm:w-1/2 sm:flex"
    >
      <div class="w-full flex justify-start">
        <img src="images/ondary-logo-white.png" class="w-28 h-auto" alt="Ondary Logo" />
      </div>
      <div class="absolute flex items-start -ml-[280px] bottom-0 justify-start w-full">
        <img src="images/loginchar.png" class="w-[700px] h-auto bottom-0" alt="Login Character" />
      </div>
      <div class="h-8"></div>
    </div>

    <div class="flex flex-col justify-center items-center w-full sm:w-1/2 py-12 px-4 sm:px-10">
      <form class="w-full max-w-sm flex flex-col gap-4" (ngSubmit)="submitLogin()">
        <h2 class="text-white text-3xl font-bold text-center mb-8">Sign In</h2>
        <div class="flex flex-col">
          <fc-input-text
            id="username"
            name="username"
            label="Username"
            [(ngModel)]="loginForm.username"
          ></fc-input-text>
          <fc-input-text
            id="password"
            name="password"
            label="Password"
            type="password"
            [(ngModel)]="loginForm.password"
          ></fc-input-text>
        </div>
        <p
          *ngIf="errorMessage"
          class="rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
        >
          {{ errorMessage }}
        </p>
        <button
          type="submit"
          class="w-full bg-primary-100 text-white font-semibold py-3 rounded-lg mt-6 shadow-sm transition hover:bg-[#e5e3e0] disabled:cursor-not-allowed disabled:opacity-70"
          [disabled]="loading"
        >
          {{ loading ? 'Loading...' : 'Continue' }}
        </button>
        <div class="text-center mt-1">
          <a href="#" class="text-tertiary-200 text-sm hover:underline">Forgot Password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
