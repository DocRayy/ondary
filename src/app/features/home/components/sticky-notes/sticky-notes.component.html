<div class="rounded-3xl bg-[#1E293B] p-5 shadow-sm">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm font-semibold text-tertiary-300">Sticky Notes</p>
      <p class="text-xs text-tertiary-50">Quick notes for today</p>
    </div>
    <span class="rounded-full bg-warning-100 px-2 py-1 text-2xs font-semibold text-warning-700">
      {{ noteCount() }}
    </span>
  </div>

  <form
    *ngIf="showForm()"
    class="mt-4 -rotate-1 space-y-3 rounded-sm bg-[#475569] p-4 text-tertiary-100 shadow-md"
    (ngSubmit)="saveNote()"
  >
    <input
      name="title"
      type="text"
      maxlength="150"
      required
      [(ngModel)]="formTitle"
      placeholder="Title note"
      class="w-full rounded-sm border-0 bg-tertiary-100 text-black px-3 py-2 text-xs font-bold outline-none"
    />
    <textarea
      name="description"
      rows="3"
      [(ngModel)]="formDescription"
      placeholder="Description"
      class="w-full resize-none rounded-sm border-0 bg-tertiary-100 text-black px-3 py-2 text-xs outline-none"
    ></textarea>
    <div class="flex gap-2">
      <button
        type="submit"
        [disabled]="saving() || !formTitle.trim() || formTitle.trim().length > 150"
        class="flex-1 rounded-md bg-[#1E293B] py-2 text-xs font-bold text-white disabled:opacity-60"
      >
        {{ saving() ? 'Saving...' : editingNote() ? 'Save' : 'Add' }}
      </button>
      <button
        type="button"
        class="rounded-md px-3 text-xs font-bold"
        (click)="cancelForm()"
      >
        Cancel
      </button>
    </div>
  </form>

  <p *ngIf="errorMessage()" class="mt-3 text-xs font-semibold text-danger-600">
    {{ errorMessage() }}
  </p>

  <p *ngIf="loading()" class="mt-4 text-xs text-tertiary-500">Load sticky notes...</p>

  <div class="mt-4 space-y-3">
    <div
      *ngFor="let note of notes(); trackBy: trackNote"
      class="rounded-2xl bg-tertiary-200 px-4 py-3 text-xs text-tertiary-700"
    >
      <div class="flex items-start justify-between gap-3">
        <p class="min-w-0 wrap-break-words text-sm font-semibold text-tertiary-800">
          {{ note.title }}
        </p>
        <div class="flex shrink-0 gap-1">
          <button
            type="button"
            class="rounded-full bg-white px-2 py-0.5 text-2xs font-semibold text-warning-700"
            (click)="openEditForm(note)"
          >
            Edit
          </button>
          <button
            type="button"
            [disabled]="deletingId() === note.id"
            class="rounded-full bg-white px-2 py-0.5 text-2xs font-semibold text-danger-600 disabled:cursor-not-allowed disabled:opacity-50"
            (click)="deleteNote(note)"
          >
            {{ deletingId() === note.id ? '...' : 'Delete' }}
          </button>
        </div>
      </div>
      <p class="mt-2 whitespace-pre-line wrap-break-words text-xs text-tertiary-600">
        {{ note.description || 'No description.' }}
      </p>
    </div>
  </div>

  <p *ngIf="!loading() && !notes().length" class="mt-4 text-xs text-tertiary-500">
    No sticky note.
  </p>

  <button
    *ngIf="!showForm()"
    type="button"
    class="mt-4 w-full rounded-xl border border-tertiary-200 py-2 text-xs font-semibold text-white"
    (click)="openCreateForm()"
  >
    Add Note
  </button>

  <app-confirmation-modal
    [visible]="!!notePendingDelete()"
    [loading]="!!deletingId()"
    title="Delete Sticky Note"
    message="Are you sure you want to delete this sticky note?"
    (cancel)="closeDeleteDialog()"
    (confirm)="confirmDeleteNote()"
  ></app-confirmation-modal>
</div>
