<div class="rounded-3xl bg-[#1E293B] p-5 shadow-sm">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm font-semibold text-tertiary-300">Manager Notes</p>
      <p class="text-xs text-tertiary-50">New Note</p>
    </div>
    <span class="rounded-full bg-tertiary-100 px-2 py-1 text-2xs font-semibold text-tertiary-800">{{
      notes().length
    }}</span>
  </div>

  <form
    *ngIf="showForm()"
    class="mt-4 -rotate-1 space-y-3 rounded-sm bg-[#475569] p-4 text-tertiary-100 shadow-md"
    (ngSubmit)="saveNote()"
  >
    <input
      name="managerNoteTitle"
      [(ngModel)]="formTitle"
      required
      maxlength="150"
      placeholder="Title"
      class="w-full rounded-sm border-0 bg-tertiary-100 text-black px-3 py-2 text-xs font-bold outline-none"
    />
    <textarea
      name="managerNoteDetail"
      [(ngModel)]="formDetail"
      rows="4"
      placeholder="Note"
      class="w-full resize-none rounded-sm border-0 bg-tertiary-100 text-black px-3 py-2 text-xs outline-none"
    ></textarea>
    <label
      class="flex items-center justify-between gap-3 rounded-sm bg-[#334155] px-3 py-2 text-xs font-semibold"
    >
      <span>Send to all users</span>
      <input
        name="managerNoteSendToAll"
        type="checkbox"
        [(ngModel)]="sendToAllUsers"
        (ngModelChange)="onSendToAllUsersChange()"
      />
    </label>

    <div *ngIf="!sendToAllUsers" class="relative" (click)="$event.stopPropagation()">
      <div
        class="flex min-h-10 flex-wrap items-center gap-2 rounded-sm bg-tertiary-100 px-2 py-2 text-black"
      >
        <span
          *ngFor="let user of selectedUsers; trackBy: trackUser"
          class="flex max-w-full items-center gap-1 rounded-full bg-[#1E293B] px-2 py-1 text-2xs font-bold text-white"
        >
          <span class="truncate">{{ user.name || user.username || user.email }}</span>
          <button
            type="button"
            class="text-white"
            aria-label="Remove selected user"
            (click)="removeSelectedUser(user)"
          >
            X
          </button>
        </span>
        <input
          name="managerNoteUserSearch"
          [(ngModel)]="userSearch"
          class="min-w-0 flex-1 bg-transparent text-xs font-bold text-black outline-none"
          placeholder="Search users"
          autocomplete="off"
          (focus)="isUserPickerOpen = true"
          (ngModelChange)="isUserPickerOpen = true"
        />
      </div>

      <div
        *ngIf="isUserPickerOpen"
        class="absolute left-0 top-full z-20 mt-1 max-h-44 w-full overflow-auto rounded-md bg-white p-2 text-xs text-black shadow-xl"
      >
        <button
          *ngFor="let user of getFilteredUsers(); trackBy: trackUser"
          type="button"
          class="block w-full rounded px-2 py-2 text-left font-semibold hover:bg-neutral-100"
          (click)="selectUser(user)"
        >
          {{ user.name || user.username || user.email }}
        </button>
        <p *ngIf="!getFilteredUsers().length" class="px-2 py-2 font-semibold text-neutral-500">
          No users found.
        </p>
      </div>
    </div>
    <p *ngIf="errorMessage()" class="text-xs font-bold text-red-700">{{ errorMessage() }}</p>
    <div class="flex gap-2">
      <button
        type="submit"
        [disabled]="saving() || !formTitle.trim() || formTitle.trim().length > 150"
        class="flex-1 rounded-md bg-[#1E293B] py-2 text-xs font-bold text-white disabled:opacity-60"
      >
        {{ saving() ? 'Saving...' : editingNote() ? 'Save' : 'Send' }}
      </button>
      <button type="button" class="rounded-md px-3 text-xs font-bold" (click)="closeForm()">
        Cancel
      </button>
    </div>
  </form>

  <div
    *ngIf="errorMessage() && !showForm()"
    class="mt-4 rounded-md bg-red-50 px-3 py-3 text-xs font-bold text-red-700"
  >
    <p>{{ errorMessage() }}</p>
    <button
      type="button"
      class="mt-2 rounded bg-red-100 px-3 py-1 text-2xs font-bold text-red-800"
      (click)="reloadNotes()"
    >
      Reload
    </button>
  </div>

  <div class="mt-4 space-y-3">
    <div
      *ngFor="let item of notes(); trackBy: trackNote"
      class="rounded-2xl bg-tertiary-200 px-4 py-3"
      [id]="'manager-note-' + item.id"
      [class.ring-2]="isHighlightedNote(item)"
      [class.ring-warning-300]="isHighlightedNote(item)"
    >
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="wrap-break-all text-sm font-semibold text-tertiary-800">{{ item.title }}</p>
          <p class="mt-1 text-2xs font-semibold text-tertiary-500">
            {{ getNoteUsername(item) }}
          </p>
        </div>
        <div *ngIf="canManageNotes" class="flex shrink-0 gap-1">
          <button
            type="button"
            class="rounded-full bg-white px-2 py-0.5 text-2xs font-semibold text-primary-700"
            (click)="openEditForm(item)"
          >
            Edit
          </button>
          <button
            type="button"
            [disabled]="deletingId() === item.id"
            class="rounded-full bg-white px-2 py-0.5 text-2xs font-semibold text-red-600 disabled:cursor-not-allowed disabled:opacity-50"
            (click)="deleteNote(item)"
          >
            {{ deletingId() === item.id ? '...' : 'Delete' }}
          </button>
        </div>
      </div>
      <p class="mt-2 text-xs text-tertiary-600">{{ getNoteDetail(item) }}</p>
      <p class="mt-3 text-2xs font-semibold uppercase text-tertiary-400">{{ getNoteTime(item) }}</p>
    </div>
  </div>

  <p *ngIf="loading()" class="mt-4 text-xs text-tertiary-50">Loading manager notes...</p>
  <p *ngIf="!loading() && !notes().length" class="mt-4 text-xs text-tertiary-50">
    No manager notes.
  </p>

  <button
    *ngIf="canManageNotes && !showForm()"
    type="button"
    class="mt-4 w-full rounded-xl border border-tertiary-200 bg-primary-600 py-2 text-xs font-semibold text-white"
    (click)="openForm()"
  >
    Create Manager Note
  </button>

  <app-confirmation-modal
    [visible]="!!notePendingDelete()"
    [loading]="!!deletingId()"
    title="Delete Manager Note"
    message="Are you sure you want to delete this manager note?"
    (cancel)="closeDeleteDialog()"
    (confirm)="confirmDeleteNote()"
  ></app-confirmation-modal>
</div>
