<aside
  #sidebarPanel
  class="relative sticky top-0 flex h-dvh w-16 shrink-0 flex-col overflow-y-auto overflow-x-visible bg-[#1A2026] px-2 py-6 text-[#D9D9D9] lg:w-20 lg:px-4"
  [class.sidebar-collapsed]="isCollapsed"
>
  <div class="relative flex items-center justify-center rounded-2xl px-1 py-3 text-sm font-semibold">
    <img
      src="images/ondary-logo-white.png"
      alt="Ondary"
      class="h-10 w-auto max-w-12 object-contain"
      [class.max-w-40]="!isCollapsed"
    />
  </div>

  <nav class="mt-8 flex-1 space-y-2">
    <a
      *ngFor="let item of visibleNavItems"
      [routerLink]="item.route"
      routerLinkActive="bg-tertiary-50 text-tertiary-700"
      [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
      class="flex h-12 w-full items-center gap-3 rounded-2xl px-3 text-left text-sm font-semibold text-[#D9D9D9] transition hover:bg-tertiary-100 hover:text-tertiary-700"
      [class.justify-center]="isCollapsed"
      [class.justify-start]="!isCollapsed"
      [title]="isCollapsed ? item.label : ''"
    >
      <fc-icon [icon]="item.icon" class="shrink-0 text-xl"></fc-icon>
      <span #collapsibleLabel class="whitespace-nowrap">{{ item.label }}</span>
    </a>
  </nav>

  <button
    type="button"
    class="mt-auto flex h-12 items-center gap-3 rounded-2xl bg-tertiary-300 px-3 text-sm font-semibold text-black transition hover:bg-tertiary-400"
    [class.justify-center]="isCollapsed"
    [class.justify-start]="!isCollapsed"
    [title]="isCollapsed ? 'Logout' : ''"
    (click)="openLogoutDialog()"
  >
    <fc-icon icon="signout-linear" class="shrink-0 text-xl"></fc-icon>
    <span #collapsibleLabel class="whitespace-nowrap">Logout</span>
  </button>
</aside>

<div
  *ngIf="isLogoutDialogOpen"
  appGsapModal
  class="fixed inset-0 z-[90] flex items-center justify-center bg-black/30 px-4"
  role="presentation"
  (click)="closeLogoutDialog()"
>
  <section
    class="w-[min(420px,calc(100vw-32px))] rounded-xl bg-white p-6 text-black shadow-2xl"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <h2 class="text-lg font-extrabold">Logout</h2>
    <p class="mt-3 text-sm font-medium text-neutral-700">Are you sure you want to logout?</p>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="h-10 rounded-md bg-neutral-100 px-5 text-sm font-bold text-black transition hover:bg-neutral-200"
        (click)="closeLogoutDialog()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="h-10 rounded-md bg-tertiary-300 px-5 text-sm font-bold text-tertiary-800 transition hover:bg-tertiary-400"
        (click)="confirmLogout()"
      >
        Logout
      </button>
    </div>
  </section>
</div>
