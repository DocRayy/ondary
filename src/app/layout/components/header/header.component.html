<header class="sticky top-0 z-30 px-3 lg:px-6">
  <div class="flex min-w-0 items-center gap-3 lg:gap-6">
    <div class="flex min-w-0 flex-1 items-center gap-3 py-2 lg:max-w-[548px]">
      <button
        type="button"
        class="grid h-11 w-11 shrink-0 place-items-center rounded-full border border-white/10 bg-[#1A2026] text-[#D9D9D9] shadow-md transition hover:bg-tertiary-100 hover:text-tertiary-700"
        [attr.aria-label]="isSidebarCollapsed ? 'Open sidebar' : 'Close sidebar'"
        (click)="toggleSidebar()"
      >
        <fc-icon
          [icon]="isSidebarCollapsed ? 'sidebar-right-linear' : 'sidebar-left-linear'"
          class="text-xl"
        ></fc-icon>
      </button>

      <div *ngIf="!isDesktopInstalled()" class="w-full">
        <button
          type="button"
          class="flex h-12 w-full items-center justify-center rounded-full bg-primary-600 px-5 text-sm font-bold text-white shadow-sm transition hover:bg-primary-700"
          (click)="installNow()"
          [disabled]="isInstallingDesktop()"
        >
          {{ isInstallingDesktop() ? 'Downloading...' : 'Install Now' }}
        </button>
      </div>
    </div>

    <div class="relative ml-auto flex min-w-0 shrink-0">
      <!-- <div
        class="hidden items-center gap-2 rounded-full border px-3 py-2 text-xs font-semibold md:flex"
        [ngClass]="
          realtimeConnected()
            ? 'border-success-200 bg-success-50 text-success-700'
            : 'border-warning-200 bg-warning-50 text-warning-700'
        "
      >
        <span
          class="h-2 w-2 rounded-full"
          [ngClass]="realtimeConnected() ? 'bg-success-500' : 'bg-warning-500'"
        ></span>
        {{ realtimeConnected() ? 'Realtime Connected' : 'Realtime Disconnected' }}
      </div> -->
      <div class="hidden items-center ml-12 gap-2 px-4 py-2 text-sm text-tertiary-50 md:flex">
        <span class="font-medium">{{ timeLabel() }}</span>
      </div>
      <button
        type="button"
        data-notifications-trigger
        (click)="toggleNotifications()"
        class="flex min-w-0 items-center gap-2 rounded-2xl bg-[#1E293B] px-3 py-2 shadow-sm transition hover:-translate-y-0.5 hover:border-primary-200 sm:gap-3 sm:px-4"
      >
        <img
          *ngIf="userPhoto(); else headerAvatarFallback"
          [src]="userPhoto()"
          alt="User photo"
          class="h-11 w-11 rounded-full object-cover"
        />
        <ng-template #headerAvatarFallback>
          <span
            class="grid h-11 w-11 place-items-center rounded-full bg-tertiary-200 text-sm font-extrabold text-tertiary-950"
          >
            {{ displayName().charAt(0).toUpperCase() }}
          </span>
        </ng-template>
        <div class="hidden min-w-0 text-left sm:block">
          <p class="truncate text-sm font-semibold text-tertiary-200">{{ displayName() }}</p>
          <p class="truncate text-xs text-tertiary-50">{{ userEmail() }}</p>
        </div>
        <span class="rounded-full bg-primary-50 px-2 py-1 text-xs font-semibold text-primary-600">
          {{ unreadNotificationCount() }}
        </span>
      </button>

      <div
        *ngIf="notificationsPanelVisible()"
        #notificationsPanel
        data-notifications-panel
        class="absolute right-0 top-16 max-h-[500px] w-[min(20rem,calc(100vw-96px))] rounded-2xl border border-primary-100 bg-primary-600 p-4 shadow-lg sm:w-80"
      >
        <div class="flex items-center justify-between">
          <p class="text-sm font-semibold text-white">Notification</p>
          <button
            type="button"
            class="text-xs font-semibold text-tertiary-300"
            (click)="closeNotifications()"
          >
            Close
          </button>
        </div>

        <button
          *ngIf="
            !isDesktopInstalled() &&
            browserNotificationPermission() !== 'granted' &&
            browserNotificationPermission() !== 'unsupported'
          "
          type="button"
          class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-white/20 bg-white/10 px-3 py-2 text-xs font-bold text-white transition hover:bg-white/20"
          (click)="enableBrowserNotifications()"
        >
          <fc-icon icon="notification-linear" class="text-base"></fc-icon>
          Enable desktop alert
        </button>

        <button
          *ngIf="!isDesktopInstalled() && browserNotificationPermission() === 'granted'"
          type="button"
          class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-white/20 bg-white/10 px-3 py-2 text-xs font-bold text-white transition hover:bg-white/20"
          (click)="testDesktopNotification()"
        >
          <fc-icon icon="notification-unread-linear" class="text-base"></fc-icon>
          Test desktop alert
        </button>

        <div class="mt-3 space-y-3 max-h-[400px] overflow-y-auto">
          <button
            *ngFor="let item of notifications()"
            type="button"
            class="w-full rounded-xl border border-primary-100 px-3 py-3 text-left text-sm shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
            [ngClass]="{
              'bg-success-50 text-success-700': item.tone === 'success',
              'bg-primary-50 text-primary-700': item.tone === 'info',
              'bg-warning-50 text-warning-700': item.tone === 'warning',
            }"
            (click)="openNotification(item)"
          >
            <p class="font-semibold">{{ item.title }}</p>
            <p *ngIf="item.message" class="mt-1 text-xs">{{ item.message }}</p>
            <p class="mt-1 text-xs text-tertiary-500">{{ item.time }}</p>
          </button>
          <div
            *ngIf="!notifications().length"
            class="rounded-xl border border-tertiary-100 px-3 py-3 text-sm font-semibold text-tertiary-500"
          >
            No Notification
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
